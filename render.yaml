# Render blueprint — one web service + one Postgres instance.
# Build installs dev tooling explicitly because Render sets NODE_ENV=production,
# which would otherwise make `npm install` skip anything in devDependencies.
#
# Migrations are NOT run here: the app applies them itself on startup (AUTO_MIGRATE),
# which also covers the first user, so a fresh deploy needs no shell access.
services:
  - type: web
    name: docket
    runtime: node
    plan: starter
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: docket-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: NODE_VERSION
        value: "20"

databases:
  - name: docket-db
    plan: basic-256mb
